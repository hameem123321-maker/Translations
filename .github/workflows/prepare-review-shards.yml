name: Prepare translation review shards

on:
  workflow_dispatch:
  push:
    branches: [translation-review]
    paths: ['.github/workflows/prepare-review-shards.yml']

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Split source files into readable shards
        run: |
          rm -rf review_shards
          cat > /tmp/shard.py <<'PY'
          import json, pathlib, hashlib
          root = pathlib.Path('.')
          out = root / 'review_shards'
          out.mkdir(exist_ok=True)
          shard_size = 25
          manifest = {'source_branch':'main','shard_size':shard_size,'files':[],'total_pairs':0}
          for p in sorted(root.glob('*.json')):
              data = json.loads(p.read_text(encoding='utf-8'))
              pairs = data.get('pairs')
              if not isinstance(pairs, list):
                  continue
              rec = {'source_file':p.name,'declared_count':data.get('count'),'actual_count':len(pairs),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'shards':[]}
              for i in range(0, len(pairs), shard_size):
                  chunk = pairs[i:i+shard_size]
                  path = out / f'{p.stem}__{i+1:06d}-{i+len(chunk):06d}.json'
                  payload = {'source_file':p.name,'review_rules':data.get('review_rules',''),'range_start':i+1,'range_end':i+len(chunk),'pairs':chunk}
                  path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
                  rec['shards'].append(str(path))
              manifest['files'].append(rec)
              manifest['total_pairs'] += len(pairs)
          (out/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2),encoding='utf-8')
          PY
          python /tmp/shard.py
      - name: Commit shards
        run: |
          git config user.name 'translation-review-bot'
          git config user.email 'translation-review-bot@users.noreply.github.com'
          git add -A review_shards
          git diff --cached --quiet || git commit -m 'Generate 25-entry review shards'
          git push origin HEAD:translation-review
