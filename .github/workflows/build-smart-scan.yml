name: Build smart dialogue scan

on:
  workflow_dispatch:
  push:
    branches: [translation-review]
    paths: ['.github/workflows/build-smart-scan.yml']

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build queue from validated deterministic findings
        run: |
          rm -rf smart_scan
          cat > /tmp/scan.py <<'PY'
          import json,pathlib,random
          source=json.loads(pathlib.Path('01_dialogue.json').read_text('utf-8'))
          audit=json.loads(pathlib.Path('audit_results/01_dialogue.audit.json').read_text('utf-8'))
          pairs=source['pairs']; rows=[]; seen=set()
          for f in audit['findings']:
              i=int(f['index'])
              if i in seen: continue
              seen.add(i)
              x=dict(pairs[i-1]); x['source_index']=i; x['scan_reasons']=f['flags']; rows.append(x)
          out=pathlib.Path('smart_scan'); out.mkdir()
          manifest={'total_dialogue':len(pairs),'candidate_count':len(rows),'candidate_rate':round(len(rows)/len(pairs),6),'basis':'audit_results/01_dialogue.audit.json','shard_size':25,'shards':[]}
          for n in range(0,len(rows),25):
              chunk=rows[n:n+25]; path=out/f'candidates__{n+1:06d}-{n+len(chunk):06d}.json'
              path.write_text(json.dumps({'candidate_start':n+1,'candidate_end':n+len(chunk),'pairs':chunk},ensure_ascii=False,indent=2),'utf-8')
              manifest['shards'].append(str(path))
          clean=[dict(x,source_index=i) for i,x in enumerate(pairs,1) if i not in seen]
          rnd=random.Random(5601); sample=rnd.sample(clean,min(500,len(clean)))
          (out/'unflagged_sample_500.json').write_text(json.dumps({'sample_size':len(sample),'seed':5601,'pairs':sorted(sample,key=lambda x:x['source_index'])},ensure_ascii=False,indent=2),'utf-8')
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),'utf-8')
          PY
          python /tmp/scan.py
      - name: Commit smart scan
        run: |
          git config user.name 'translation-review-bot'
          git config user.email 'translation-review-bot@users.noreply.github.com'
          git add -A smart_scan
          git diff --cached --quiet || git commit -m 'Generate high-signal dialogue review queue'
          git push origin HEAD:translation-review
